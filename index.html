<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1011">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Sistema de diseño Cockpit · base Forja
     superficies: bg < panel < panel2 < panel3 · acento: rojo forja (rellenos) / accent-fg (texto) · acero: secundario */
  --bg:#0E1011; --panel:#16181A; --panel2:#1F2224; --panel3:#262A2C; --line:#2C3033; --text:#EDEAE3; --muted:#8B9196;
  --accent:#C4432D; --accent-ink:#FFFFFF; --accent-fg:#E2644D; --steel:#5C7A88; --steel-fg:#8FB0C0;
  --good:#4E8B6B; --good-fg:#6FB690; --bad:#EE6F6A; --warn:#D4A64A;
  --c1:#D9573F; --c2:#5FA37F; --c3:#6C97AB; --c4:#D4A64A; --c5:#C77D9B; --c6:#8E86C4; --c7:#9BB06A; --c8:#8B9196;
  --radius:4px; --ctl:3px; --nav-h:64px; --shadow:none;
  --font-d:Oswald,"Arial Narrow","Roboto Condensed",sans-serif; --font-b:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEEBE4; --panel:#F8F6F1; --panel2:#E9E5DC; --panel3:#DFDACE; --line:#D3CEC2; --text:#16181A; --muted:#5E656A;
    --accent:#B03A26; --accent-ink:#FFFFFF; --accent-fg:#B03A26; --steel:#4A6573; --steel-fg:#3E5866;
    --good:#2F7556; --good-fg:#2F7556; --bad:#B3342F; --warn:#8A6410;
    --c1:#B03A26; --c2:#2F7556; --c3:#3E6E86; --c4:#9C7415; --c5:#9A4F72; --c6:#5E5499; --c7:#5F7A2E; --c8:#5E656A; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEEBE4; --panel:#F8F6F1; --panel2:#E9E5DC; --panel3:#DFDACE; --line:#D3CEC2; --text:#16181A; --muted:#5E656A;
  --accent:#B03A26; --accent-ink:#FFFFFF; --accent-fg:#B03A26; --steel:#4A6573; --steel-fg:#3E5866;
  --good:#2F7556; --good-fg:#2F7556; --bad:#B3342F; --warn:#8A6410;
  --c1:#B03A26; --c2:#2F7556; --c3:#3E6E86; --c4:#9C7415; --c5:#9A4F72; --c6:#5E5499; --c7:#5F7A2E; --c8:#5E656A; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font-b);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--font-d);font-weight:600;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good-fg)} .bad{color:var(--bad)}
a{color:var(--accent-fg)}

/* layout */
.shell{max-width:1040px;margin:0 auto;padding-top:12px;padding-bottom:28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 0 18px}
header.top .hello{font-size:14px;color:var(--muted);margin-bottom:2px}
header.top .hello::first-letter{text-transform:uppercase}
header.top h1{font-size:34px;line-height:1.08;letter-spacing:.01em;font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:var(--ctl);border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.brand{display:none;align-items:center;gap:12px;font-family:var(--font-d);font-weight:700;font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-fg);padding:6px 14px 22px}
.brand::before{content:"";width:24px;height:20px;flex:none;background:linear-gradient(var(--accent),var(--accent)) 0 100%/4px 9px no-repeat,linear-gradient(var(--accent),var(--accent)) 7px 100%/4px 14px no-repeat,linear-gradient(var(--accent),var(--accent)) 14px 100%/4px 20px no-repeat,linear-gradient(var(--steel),var(--steel)) 21px 100%/2px 20px no-repeat}

/* nav: móvil = barra inferior con 4 + Más; escritorio = barra lateral completa */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:0 6px env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1 1 0;min-width:0;height:var(--nav-h);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);cursor:pointer;font-size:12px;font-weight:550}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--accent-fg)}
nav.tabs .x2{display:none}
@media (min-width:860px){
  body{padding-bottom:0;padding-left:224px}
  nav.tabs{top:0;right:auto;width:224px;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--line);padding:22px 12px;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  nav.tabs button{flex:0 0 auto;height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;border-radius:var(--ctl);font-size:15px}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button[aria-current="true"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
  nav.tabs .x2{display:flex}
  nav.tabs .more{display:none}
  nav.tabs .gap{margin-top:14px}
  .brand{display:flex}
  .shell{padding-top:28px}
}

/* cards */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
.g3,.g4{grid-template-columns:1fr 1fr}
@media (min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.grid{gap:16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:17px;font-weight:600;letter-spacing:.03em;color:var(--text);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.card h2 .num{font-weight:650}
.kpi h2{font-size:14px;font-weight:550;color:var(--muted);margin-bottom:6px;min-height:0}
.kpi .v{font-family:var(--font-d);font-size:32px;line-height:1.1;font-weight:600;letter-spacing:.005em}
.kpi .s{font-size:13px;color:var(--muted);margin-top:6px}
.hero{padding:22px 20px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--radius)}
.hero .l{font-size:14px;font-weight:550;opacity:.8}
.hero .big{font-family:var(--font-d);font-size:52px;line-height:1.05;font-weight:600;letter-spacing:.005em;margin:6px 0 14px}
.hero .bar{background:color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.hero .bar>i{background:var(--accent-ink)}
.hero .meta{display:flex;gap:22px;margin-top:14px;font-size:13px;opacity:.85;flex-wrap:wrap}
.hero .meta b{display:block;font-family:var(--font-d);font-size:19px;font-weight:600;letter-spacing:.01em}
.section{margin-top:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sp{height:10px}

/* controls */
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:var(--ctl);min-height:44px;padding:0 16px;cursor:pointer;font-weight:550}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;font-family:var(--font-d);letter-spacing:.06em;font-size:15px}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:var(--ctl)}
.btn.danger{color:var(--bad)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:var(--ctl);padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;min-height:36px;padding:0 15px;border-radius:var(--ctl);cursor:pointer;color:var(--muted);white-space:nowrap;font-size:14px;font-weight:550}
.seg button[aria-pressed="true"]{background:var(--panel3);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:var(--ctl);padding:0 14px;min-height:46px;width:100%;font-size:16px}
textarea{padding:12px 14px;min-height:60vh;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--steel);background:var(--panel)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:block;font-size:13px;font-weight:550;color:var(--muted);margin:14px 0 6px}

/* piezas */
.bar{height:10px;border-radius:var(--ctl);background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:var(--ctl)}
.bar.over>i{background:var(--bad)}
.list>.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.list>.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:15px}
.chk{width:26px;height:26px;border-radius:var(--ctl);border:2px solid var(--line);background:none;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.chk[aria-checked="true"]{background:var(--good);border-color:var(--good);color:#fff}.chk svg{width:16px;height:16px}
.done{text-decoration:line-through;color:var(--muted)}
.xbtn{background:none;border:0;color:var(--muted);cursor:pointer;min-width:36px;min-height:36px;border-radius:var(--ctl)}
.xbtn:hover{color:var(--bad)}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--ctl);border:0;background:var(--panel2);color:var(--muted);flex:none;font-family:inherit}
.badge.alta{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel2))}
.badge.media{color:var(--accent-fg)}
.badge.buy{color:var(--good-fg);background:color-mix(in srgb,var(--good) 15%,var(--panel2))}
.habit-grid{display:grid;grid-template-columns:1fr repeat(7,36px);gap:6px;align-items:center}
.habit-grid .hd{font-size:12px;color:var(--muted);text-align:center}
.habit-grid .cell{width:36px;height:36px;border-radius:var(--ctl);border:0;background:var(--panel2);cursor:pointer;padding:0}
.habit-grid .cell[aria-pressed="true"]{background:var(--good)}
.habit-grid .cell.today{outline:2px solid var(--steel);outline-offset:1px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media (max-width:420px){.pgrid{grid-template-columns:repeat(2,1fr)}}
.fab{font-family:var(--font-d);letter-spacing:.06em;font-size:15px;position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:15;height:54px;padding:0 22px;border-radius:var(--ctl);border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;box-shadow:0 10px 28px -8px rgba(0,0,0,.45)}
@media (min-width:860px){.fab{font-family:var(--font-d);letter-spacing:.06em;font-size:15px;bottom:28px;right:32px}}
dialog{border:0;border-radius:var(--ctl);background:var(--panel);color:var(--text);padding:22px;width:min(460px,calc(100vw - 24px));max-height:90dvh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{font-size:22px;margin-bottom:6px;letter-spacing:.02em}
@media (max-width:600px){dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:var(--ctl) 26px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.sheet{display:grid;gap:4px;margin-top:10px}
.sheet button{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 12px;border:0;border-radius:var(--ctl);background:none;cursor:pointer;font-size:16px;font-weight:550;text-align:left}
.sheet button:hover,.sheet button[aria-current="true"]{background:var(--panel2)}
.sheet svg{width:22px;height:22px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 86px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:var(--ctl);font-size:15px;font-weight:550;z-index:50;max-width:calc(100vw - 32px)}
svg text{fill:var(--muted);font-size:10px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{flex:1;min-width:160px;font-size:14px}
.legend .li{display:flex;align-items:center;gap:8px;padding:4px 0}
@media (prefers-reduced-motion:no-preference){.hero .bar>i,.bar>i{transition:width .5s cubic-bezier(.2,.8,.2,1)}.bar.lg>i{transition-duration:1s}}
.pctbig{font-family:var(--font-d);font-size:46px;line-height:1;font-weight:600;letter-spacing:.005em}
.bar.lg{height:14px}.bar.off>i{background:var(--muted);opacity:.5}
.stats{display:flex;gap:10px 28px;flex-wrap:wrap;margin-top:16px}
.stats b{display:block;font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:.01em}.stats span{font-size:13px;color:var(--muted)}
.card.alerta{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--panel))}

/* iconos */
.ico{width:1.1em;height:1.1em;vertical-align:-.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.lg{width:22px;height:22px}
h2 .ico,.row .ico{color:var(--muted)}
.tile{display:grid;place-items:center;width:36px;height:36px;background:var(--panel2);border:1px solid var(--line);color:var(--steel-fg);flex:none;border-radius:var(--ctl)}
.tile.acc{color:var(--accent-fg)}
.k{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
/* agenda */
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:4px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .t{font-family:var(--font-d);font-size:17px;font-weight:600;letter-spacing:.02em;line-height:1.25}
.ev .t small{display:block;font-family:var(--font-b);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.ev .w{min-width:0}.ev .w b{font-weight:600}
.ev.now{box-shadow:inset 3px 0 0 var(--accent);padding-left:12px;margin-left:-12px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%)}
.ev.past{opacity:.5}
.daytitle{font-family:var(--font-d);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:capitalize;color:var(--muted);margin:18px 0 2px}
.daytitle:first-child{margin-top:0}
.nowcard{position:relative;overflow:hidden}
.nowcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent);margin-right:8px}
.live{font-size:12px;color:var(--muted)}
/* forja */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:grid;gap:5px;justify-items:center;font-size:12px;color:var(--muted)}
.week i{display:block;width:100%;height:28px;background:var(--panel2);border:1px solid var(--line)}
.week .on i{background:var(--accent);border-color:var(--accent)}
.week .today i{border-color:var(--steel)}
.week .on.today i{border-color:var(--accent)}
.exrow{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius)}
.exrow+.exrow{margin-top:8px}
.exrow h3{font-size:18px;letter-spacing:.01em}
.exrow .meta{font-size:13px;color:var(--muted);margin-top:4px}
.kg{display:flex;align-items:center;gap:6px;background:var(--panel3);border:1px solid var(--line);padding:0 10px 0 12px;height:44px;flex:none;border-radius:var(--ctl)}
.kg input{width:52px;min-height:0;height:100%;background:transparent;border:0;text-align:right;padding:0;font-weight:600}
.kg input:focus{background:transparent}
.kg span{font-size:12px;color:var(--muted)}
.rec{color:var(--accent-fg);font-weight:600}
.timer{font-family:var(--font-d);font-size:40px;font-weight:600;letter-spacing:.02em;line-height:1}
.btn.go{background:var(--good);border-color:var(--good);color:#0E1011;font-family:var(--font-d);font-weight:600;letter-spacing:.06em;font-size:15px}
.btn.wide{width:100%;min-height:48px}

.navh{display:none}
@media (min-width:860px){nav.tabs .navh.x2{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);padding:18px 14px 6px}nav.tabs .navh.x2:first-of-type{padding-top:4px}}
.hl{font-family:var(--font-d);font-size:30px;font-weight:600;line-height:1.1;letter-spacing:.01em}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:var(--ctl);cursor:pointer;padding:0}
.ibtn:hover{color:var(--text);border-color:var(--steel)}.ibtn.danger:hover{color:var(--bad);border-color:var(--bad)}
.ibtn .ico{width:18px;height:18px}
/* metas */
.card.meta{display:flex;flex-direction:column;gap:0}
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 0 12px}
.mamt{text-align:right;line-height:1.2}.mamt b{font-family:var(--font-d);font-size:22px;font-weight:600;letter-spacing:.01em}.mamt span{color:var(--muted);font-size:14px}
.gauge{position:relative;height:16px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.gauge>i{display:block;height:100%;background:var(--accent);border-radius:0;transition:none}
.gauge::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 2px),var(--panel) calc(25% - 2px) 25%)}
.gauge.ok>i{background:var(--good)}.gauge.late>i{background:var(--warn)}.gauge.off>i{background:var(--muted);opacity:.45}
@media (prefers-reduced-motion:no-preference){.gauge>i{transition:width 1s cubic-bezier(.2,.8,.2,1)}}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mstats div{min-width:0}.mstats .k{display:block;margin-bottom:2px}.mstats b{font-family:var(--font-d);font-size:19px;font-weight:600;letter-spacing:.01em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnote{margin-top:12px;font-size:14px;color:var(--muted)}.mnote.warn{color:var(--warn)}
.mact{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mact .sp2{flex:1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 16px;margin-top:18px}
.stats3 b{display:block;font-family:var(--font-d);font-size:24px;font-weight:600}.stats3 span{font-size:13px;color:var(--muted)}
.card.ok{border-color:color-mix(in srgb,var(--good) 55%,var(--line));background:color-mix(in srgb,var(--good) 8%,var(--panel))}
nav.tabs button{position:relative}.nb{position:absolute;top:10px;left:calc(50% + 6px);width:8px;height:8px;background:var(--accent);border-radius:50%}
@media (min-width:860px){.nb{top:50%;left:auto;right:14px;margin-top:-4px}}

<script>
(() => {
'use strict';

/* ---------- utils ---------- */
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const dKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const eur0 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' });

const monthLabel = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }); };
const shiftMonth = (k, delta) => { const [y, m] = k.split('-').map(Number); return mKey(new Date(y, m - 1 + delta, 1)); };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : 0; };

/* ---------- state ---------- */
const KEY = 'cockpit.v1';
const CATS_OUT = ['Vivienda', 'Comida', 'Transporte', 'Ocio', 'Salud', 'Suscripciones', 'Compras', 'Otros'];
const CATS_IN = ['Nómina', 'Extra', 'Inversiones', 'Pasivos', 'Otros'];
const defaults = () => ({

  radar: [],
  prices: [],
  gx: null,
  gxCfg: null,

  budgets: {},

    { id: uid(), ic: 'check', title: 'Pendientes', items: [] },
    { id: uid(), ic: 'music', title: 'Música y pelis', items: [] },
    { id: uid(), ic: 'book', title: 'Aprender', items: [] },
    { id: uid(), ic: 'nav', title: 'Viajes', items: [] },
    { id: uid(), ic: 'bulb', title: 'Ideas', items: [] }
  ],
  notes: ''
});
let S;
try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { S = defaults(); }
const EMO2IC = { '✅': 'check', '🎧': 'music', '📚': 'book', '✈️': 'nav', '✈': 'nav', '💡': 'bulb', '⭐': 'star' };

const ui = { tab: 'hoy', fin: 'mov', month: mKey(new Date()) };

/* ---------- icons ---------- */

  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',

const ic = (k, c = '') => `<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${I[k] || ''}</svg>`;
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const NAV_GROUPS = [['Día a día', ['hoy', 'agenda', 'radar']], ['Dinero', ['gastos', 'precios', 'fin', 'metas']], ['Vida', ['hab', 'viaje', 'int', 'notas', 'widgets']]];
const NAV_ORDER = NAV_GROUPS.flatMap(g => g[1]), NAV_MAIN = ['hoy', 'agenda', 'gastos', 'precios', 'hab'];
const tabName = k => TABS.find(t => t[0] === k)[1];
const TABS = [['hoy', 'Hoy'], ['agenda', 'Agenda'], ['radar', 'Radar'], ['precios', 'Precios'], ['gastos', 'Gastos'], ['fin', 'Finanzas'], ['metas', 'Metas'], ['hab', 'Forja'], ['viaje', 'Viaje'], ['int', 'Intereses'], ['notas', 'Notas'], ['widgets', 'Widgets']];

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
function form(title, fields, onSubmit, opts = {}) {
  const body = fields.map(f => {
    const v = f.value ?? '';
    let input;
    if (f.type === 'select') input = `<select name="${f.name}">${f.options.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;

    else input = `<input name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${f.step ? `step="${f.step}"` : ''} ${f.inputmode ? `inputmode="${f.inputmode}"` : ''} ${f.required ? 'required' : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} autocomplete="off">`;

  }).join('');

function confirmBox(title, text, onYes, ok = 'Confirmar') {

  $('[data-x]', dlg).onclick = () => dlg.close();

/* ---------- carga ---------- */
document.body.insertAdjacentHTML('afterbegin', '<div id="topbar" aria-hidden="true"></div>');
function busy(v) {

}
const SKEL_TABS = {
  agenda: () => !S.live.at, radar: () => !S.radar.length && !S.live.at, precios: () => !S.prices.length, metas: () => !S.metas.list.length,

/* ---------- derived ---------- */
const txOfMonth = k => S.tx.filter(t => t.date.startsWith(k));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + f(x), 0);
function monthStats(k) {
  const t = txOfMonth(k);
  const inc = sum(t.filter(x => x.type === 'in'), x => x.amount);
  const out = sum(t.filter(x => x.type === 'out'), x => x.amount);
  return { inc, out, bal: inc - out, rate: inc > 0 ? ((inc - out) / inc) * 100 : 0 };
}
const netWorth = () => sum(S.accounts, a => a.kind === 'Deuda' ? -a.value : a.value);
const byCat = k => {
  const m = {};
  txOfMonth(k).filter(t => t.type === 'out').forEach(t => { m[t.cat] = (m[t.cat] || 0) + t.amount; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
};
function weekCount(h) {
  const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  let n = 0;
  for (let i = 0; i < 7; i++) { if (h.log[dKey(d)]) n++; d.setDate(d.getDate() + 1); }
  return n;
}
function streak(h) {
  let n = 0; const d = new Date();
  if (!h.log[dKey(d)]) d.setDate(d.getDate() - 1);
  while (h.log[dKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- charts ---------- */
function donut(data) {
  const total = sum(data, d => d[1]);
  if (!total) return '';
  let off = 25;
  const arcs = data.map(([c, v], i) => {
    const p = (v / total) * 100;
    const s = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--c${(i % 8) + 1})" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`;
    off -= p; return s;
  }).join('');
  return `<svg viewBox="0 0 42 42" width="150" height="150" role="img" aria-label="Gasto por categoría">${arcs}<text x="21" y="21.8" text-anchor="middle" style="fill:var(--text);font-size:6px;font-weight:700">${esc(eur0.format(total))}</text></svg>`;

/* ---------- file saving (browser + Android) ---------- */
async function saveFile(name, mime, text) {
  const P = window.Capacitor?.Plugins;
  if (P?.Filesystem && P?.Share) {
    try {
      const r = await P.Filesystem.writeFile({ path: name, data: text, directory: 'CACHE', encoding: 'utf8' });
      await P.Share.share({ title: name, url: r.uri });
      return;
    } catch (err) { if (/cancel/i.test(String(err))) return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function priceCalc(p) {
  const priced = (p.history || []).filter(h => h.price > 0);
  if (!priced.length) return { last: null, date: '', min: null, diff: null, verdict: '' };
  const date = priced.map(h => h.date).sort().at(-1);
  const last = Math.min(...priced.filter(h => h.date === date).map(h => h.price));
  const min = Math.min(...priced.map(h => h.price));
  const diff = p.target > 0 ? last - p.target : null;
  const verdict = p.status === 'Vigilando' && p.target > 0 ? (last <= p.target ? 'COMPRAR' : 'Esperar') : '';
  return { last, date, min, diff, verdict };
}

/* ---------- importador BBVA (CSV) ---------- */
function parseBBVA(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  const head = (lines.shift() || '').split(';').map(s => s.trim().toLowerCase());
  const ix = n => head.indexOf(n);
  const [iF, iC, iI, iS, iA, iE, iK] = ['fecha', 'concepto', 'importe', 'saldo', 'cuenta', 'estado', 'categoría'].map(ix);
  if ([iF, iC, iI].some(i => i < 0)) throw new Error('No parece un CSV de BBVA (faltan Fecha/Concepto/Importe).');
  const parseNum = s => { s = String(s ?? '').trim(); if (!s) return null; const n = parseFloat(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s); return Number.isFinite(n) ? n : null; };
  const out = { tx: [], balances: {}, internal: 0, pending: 0 };
  for (const l of lines) {
    const c = l.split(';'), date = (c[iF] || '').trim(), concept = (c[iC] || '').trim(), amt = parseNum(c[iI]);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || amt == null) continue;
    const acc = (c[iA] || '').trim(), saldo = parseNum(c[iS]);
    if (acc && saldo != null) out.balances[acc] = saldo;
    if (/^pendiente/i.test((c[iE] || '').trim())) { out.pending++; continue; }
    if (/^traspaso\b/i.test(concept)) { out.internal++; continue; }
    const bcat = (c[iK] || '').trim();
    const type = amt >= 0 ? 'in' : 'out';
    const cat = type === 'in' ? (bcat === 'Nómina' ? 'Nómina' : 'Otros') : (CATS_OUT.includes(bcat) ? bcat : 'Otros');
    const note = concept.replace(/\s*-\s*(Pago con tarjeta|\[OCULTO\])\s*$/i, '').replace(/\s*\.\.\.\s*$/, '').trim();
    out.tx.push({ date, type, amount: Math.abs(amt), cat, note: note || concept, src: 'bbva', key: [date, concept, amt, acc, saldo ?? ''].join('|') });
  }
  return out;
}
function applyBBVA(text) {
  const r = parseBBVA(text);
  const have = new Set(S.tx.filter(t => t.key).map(t => t.key));
  let added = 0;
  r.tx.forEach(t => { if (!have.has(t.key)) { S.tx.push({ id: uid(), ...t }); added++; } });
  Object.entries(r.balances).forEach(([acc, v]) => {
    const name = 'BBVA · ' + acc;
    const a = S.accounts.find(x => x.name === name);
    if (a) a.value = v; else S.accounts.push({ id: uid(), name, kind: 'Efectivo / cuenta', value: v });
  });
  return { added, dupes: r.tx.length - added, internal: r.internal, pending: r.pending, accounts: Object.keys(r.balances).length };
}
function importBBVA() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,text/csv,text/plain';
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    try { const r = applyBBVA(await inp.files[0].text()); commit(); toast(`BBVA: ${r.added} nuevos, ${r.dupes} ya estaban`); }
    catch (e) { toast(e.message || 'No se pudo leer el CSV'); }
  };
  inp.click();
}

/* ---------- Gastos: lee el Excel de Drive (Resumen / Plan / Movimientos / Grupos) ---------- */
const gxNum = v => {
  if (typeof v === 'number') return Number.isFinite(v) ? v : null;
  if (typeof v !== 'string') return null;
  const s = v.trim().replace(/[€\s]/g, ''); if (!/^\(?-?[\d.,]+\)?$/.test(s)) return null;
  const neg = s.startsWith('(') || s.startsWith('-'); const n = parseFloat(s.replace(/[()\-]/g, '').replace(/,/g, ''));
  return Number.isFinite(n) ? (neg ? -n : n) : null;
};
const gxDate = v => {
  if (typeof v === 'number') return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = String(v ?? '').trim(); if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
};
function parseGx(wb) {
  const X = window.XLSX; if (!X) throw new Error('Falta la librería de Excel.');
  const sh = n => { const k = wb.SheetNames.find(s => s.trim().toLowerCase() === n); return k ? X.utils.sheet_to_json(wb.Sheets[k], { header: 1, raw: true, defval: null }) : null; };
  const rs = sh('resumen'), mv = sh('movimientos'), pl = sh('plan'), gr = sh('grupos');
  if (!rs || !mv) throw new Error('No encuentro las hojas «Resumen» y «Movimientos» en ese Excel.');
  const hi = rs.findIndex(r => String(r[0] ?? '').trim().toLowerCase() === 'grupo');
  if (hi < 0) throw new Error('La hoja Resumen no tiene la cabecera «Grupo».');
  const head = rs[hi], find = re => head.findIndex(h => re.test(String(h ?? '')));
  const iMedia = find(/^media(?!\s+vs)/i), iPlan = find(/^plan/i), iTope = find(/^tope/i), iDif = find(/media\s+vs/i);
  if (iMedia < 2) throw new Error('No reconozco las columnas de meses del Resumen.');
  const keys = head.filter(h => typeof h === 'number' && h > 200000);
  const months = head.slice(1, iMedia).map((h, i) => ({ key: String(keys[i] ?? ''), label: String(h).split(' ')[0] }));
  const mm = String(head[iMedia]).match(/(\w{3})\s*[–-]\s*(\w{3})/);
  let a = mm ? months.findIndex(m => m.label === mm[1]) : 1, b = mm ? months.findIndex(m => m.label === mm[2]) : months.length - 2;
  if (a < 0 || b < a) { a = 1; b = Math.max(1, months.length - 2); }
  const G = { name: '', loadedAt: new Date().toISOString(), title: String(rs[0]?.[0] ?? ''), nota: String(rs[1]?.[0] ?? ''), months, mediaIdx: [a, b], rows: [], extra: [], notes: [], plan: {}, grupos: [], mov: [], ov: {}, topes: {}, uncalc: false };
  let sec = '', mode = 'main';
  for (const r of rs.slice(hi + 1)) {
    const label = String(r[0] ?? '').trim(); if (!label) continue;
    if (/^AHORRO REAL/i.test(label)) { mode = 'extra'; continue; }
    if (/^NOTAS/i.test(label)) { mode = 'notes'; continue; }
    if (mode === 'extra') { G.extra.push({ label, value: gxNum(r[1]) }); continue; }
    if (mode === 'notes') { G.notes.push(label); continue; }
    const v = r.slice(1, iMedia).map(gxNum), o = [iMedia, iPlan, iTope, iDif].map(i => i < 0 ? null : gxNum(r[i]));
