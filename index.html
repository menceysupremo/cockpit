<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cockpit</title>
<style>
:root{
  --bg:#0c0d10; --panel:#15171b; --panel2:#1e2127; --line:#262a31; --text:#f1f2f4; --muted:#9aa0ab;
  --accent:#8394ff; --accent-ink:#0b0e24; --good:#3dd598; --bad:#ff6b76; --warn:#ffc15e;
  --c1:#8394ff; --c2:#3dd598; --c3:#5bb5ff; --c4:#ff8ad8; --c5:#ff6b76; --c6:#ffc15e; --c7:#8be28b; --c8:#9aa0ab;
  --radius:22px; --ctl:14px; --nav-h:68px; --shadow:none; color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f6; --panel:#ffffff; --panel2:#f0f1f4; --line:#e4e6eb; --text:#0f1115; --muted:#667085;
    --accent:#3b4fe4; --accent-ink:#ffffff; --good:#0e9f5b; --bad:#d93c48; --warn:#b7791f; --shadow:0 1px 2px rgba(16,24,40,.05);
    --c1:#3b4fe4; --c2:#0e9f5b; --c3:#2b86d9; --c4:#b44fc4; --c5:#d93c48; --c6:#c98a12; --c7:#d9703a; --c8:#7a8591; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f6; --panel:#ffffff; --panel2:#f0f1f4; --line:#e4e6eb; --text:#0f1115; --muted:#667085;
  --accent:#3b4fe4; --accent-ink:#ffffff; --good:#0e9f5b; --bad:#d93c48; --warn:#b7791f; --shadow:0 1px 2px rgba(16,24,40,.05);
  --c1:#3b4fe4; --c2:#0e9f5b; --c3:#2b86d9; --c4:#b44fc4; --c5:#d93c48; --c6:#c98a12; --c7:#d9703a; --c8:#7a8591; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.015em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)}
a{color:var(--accent)}

/* layout */
.shell{max-width:1040px;margin:0 auto;padding-top:12px;padding-bottom:28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 0 18px}
header.top .hello{font-size:14px;color:var(--muted);margin-bottom:2px}
header.top .hello::first-letter{text-transform:uppercase}
header.top h1{font-size:30px;line-height:1.15;letter-spacing:-.025em;font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.brand{display:none;font-weight:700;font-size:19px;letter-spacing:-.02em;padding:6px 14px 20px}
.brand::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:10px}

/* nav: móvil = barra inferior con 4 + Más; escritorio = barra lateral completa */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:0 6px env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1 1 0;min-width:0;height:var(--nav-h);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);cursor:pointer;font-size:12px;font-weight:550}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--accent)}
nav.tabs .x2{display:none}
@media (min-width:860px){
  body{padding-bottom:0;padding-left:224px}
  nav.tabs{top:0;right:auto;width:224px;flex-direction:column;gap:2px;border-top:0;border-right:1px solid var(--line);padding:22px 12px;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  nav.tabs button{flex:0 0 auto;height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;border-radius:14px;font-size:15px}
  nav.tabs button svg{width:22px;height:22px}
  nav.tabs button[aria-current="true"]{background:var(--panel);box-shadow:var(--shadow)}
  nav.tabs .x2{display:flex}
  nav.tabs .more{display:none}
  nav.tabs .gap{margin-top:14px}
  .brand{display:block}
  .shell{padding-top:28px}
}

/* cards */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
.g3,.g4{grid-template-columns:1fr 1fr}
@media (min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.grid{gap:16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:16px;font-weight:650;color:var(--text);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.card h2 .num{font-weight:650}
.kpi h2{font-size:14px;font-weight:550;color:var(--muted);margin-bottom:6px;min-height:0}
.kpi .v{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.035em}
.kpi .s{font-size:13px;color:var(--muted);margin-top:6px}
.hero{padding:22px 20px;background:var(--accent);color:var(--accent-ink);border:0}
.hero .l{font-size:14px;font-weight:550;opacity:.8}
.hero .big{font-size:46px;line-height:1.05;font-weight:750;letter-spacing:-.045em;margin:6px 0 14px}
.hero .bar{background:color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.hero .bar>i{background:var(--accent-ink)}
.hero .meta{display:flex;gap:22px;margin-top:14px;font-size:13px;opacity:.85;flex-wrap:wrap}
.hero .meta b{display:block;font-size:17px;letter-spacing:-.02em}
.section{margin-top:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.sp{height:10px}

/* controls */
.btn{border:0;background:var(--panel2);border-radius:var(--ctl);min-height:44px;padding:0 16px;cursor:pointer;font-weight:550}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:12px}
.btn.danger{color:var(--bad)}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;min-height:36px;padding:0 15px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:14px;font-weight:550}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
input,select,textarea{background:var(--panel2);border:1px solid transparent;border-radius:var(--ctl);padding:0 14px;min-height:46px;width:100%;font-size:16px}
textarea{padding:12px 14px;min-height:60vh;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--panel)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:block;font-size:13px;font-weight:550;color:var(--muted);margin:14px 0 6px}

/* piezas */
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}
.list>.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.list>.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:15px}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:none;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.chk[aria-checked="true"]{background:var(--good);border-color:var(--good);color:#fff}
.done{text-decoration:line-through;color:var(--muted)}
.xbtn{background:none;border:0;color:var(--muted);cursor:pointer;min-width:36px;min-height:36px;border-radius:10px}
.xbtn:hover{color:var(--bad)}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:0;background:var(--panel2);color:var(--muted);flex:none;font-family:inherit}
.badge.alta{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel2))}
.badge.media{color:var(--accent)}
.badge.buy{color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--panel2))}
.habit-grid{display:grid;grid-template-columns:1fr repeat(7,36px);gap:6px;align-items:center}
.habit-grid .hd{font-size:12px;color:var(--muted);text-align:center}
.habit-grid .cell{width:36px;height:36px;border-radius:11px;border:0;background:var(--panel2);cursor:pointer;padding:0}
.habit-grid .cell[aria-pressed="true"]{background:var(--good)}
.habit-grid .cell.today{outline:2px solid var(--accent);outline-offset:1px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media (max-width:420px){.pgrid{grid-template-columns:repeat(2,1fr)}}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:15;height:54px;padding:0 22px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;box-shadow:0 10px 28px -8px rgba(0,0,0,.45)}
@media (min-width:860px){.fab{bottom:28px;right:32px}}
dialog{border:0;border-radius:26px;background:var(--panel);color:var(--text);padding:22px;width:min(460px,calc(100vw - 24px));max-height:90dvh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{font-size:20px;margin-bottom:6px;letter-spacing:-.02em}
@media (max-width:600px){dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:26px 26px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.sheet{display:grid;gap:4px;margin-top:10px}
.sheet button{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 12px;border:0;border-radius:14px;background:none;cursor:pointer;font-size:16px;font-weight:550;text-align:left}
.sheet button:hover,.sheet button[aria-current="true"]{background:var(--panel2)}
.sheet svg{width:22px;height:22px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 86px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:15px;font-weight:550;z-index:50;max-width:calc(100vw - 32px)}
svg text{fill:var(--muted);font-size:10px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{flex:1;min-width:160px;font-size:14px}
.legend .li{display:flex;align-items:center;gap:8px;padding:4px 0}
@media (prefers-reduced-motion:no-preference){.hero .bar>i,.bar>i{transition:width .5s cubic-bezier(.2,.8,.2,1)}.bar.lg>i{transition-duration:1s}}
.pctbig{font-size:44px;line-height:1;font-weight:750;letter-spacing:-.045em}
.bar.lg{height:14px}.bar.off>i{background:var(--muted);opacity:.5}
.stats{display:flex;gap:10px 28px;flex-wrap:wrap;margin-top:16px}
.stats b{display:block;font-size:22px;letter-spacing:-.025em}.stats span{font-size:13px;color:var(--muted)}
.card.alerta{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
</style>
</head>
<body>
<nav class="tabs" id="nav" aria-label="Secciones"></nav>
<div class="shell">
    <header class="top">
    <div>
      <div class="hello" id="hello"></div>
      <h1 id="title"></h1>
    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="Ajustes">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" hidden></button>
<dialog id="dlg"></dialog>

<script src="xlsx.mini.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- utils ---------- */
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2, '0');
const dKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const mKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const eur0 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0, useGrouping: 'always' });
const eur2 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, useGrouping: 'always' });
const money = (n, dec) => (dec ?? (Math.abs(n) % 1 ? 2 : 0)) ? eur2.format(n) : eur0.format(n);
const pct = n => `${Math.round(n)}%`;
const monthLabel = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }); };
const shiftMonth = (k, delta) => { const [y, m] = k.split('-').map(Number); return mKey(new Date(y, m - 1 + delta, 1)); };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : 0; };

/* ---------- state ---------- */
const KEY = 'cockpit.v1';
const CATS_OUT = ['Vivienda', 'Comida', 'Transporte', 'Ocio', 'Salud', 'Suscripciones', 'Compras', 'Otros'];
const CATS_IN = ['Nómina', 'Extra', 'Inversiones', 'Pasivos', 'Otros'];
const defaults = () => ({
  name: 'Sergio',
  theme: 'auto',
  radar: [],
  prices: [],
  gx: null,
  gxCfg: null,
  tx: [],
  budgets: {},
  accounts: [],
  goals: [],
  metas: null,
  habits: [
    { id: uid(), name: 'Ir al gimnasio', goal: 4, log: {} },
    { id: uid(), name: 'Leer 15 min', log: {} },
    { id: uid(), name: 'Revisar mis gastos', log: {} }
  ],
  lists: [
    { id: uid(), emoji: '✅', title: 'Pendientes', items: [] },
    { id: uid(), emoji: '🎧', title: 'Música y pelis', items: [] },
    { id: uid(), emoji: '📚', title: 'Aprender', items: [] },
    { id: uid(), emoji: '✈️', title: 'Viajes', items: [] },
    { id: uid(), emoji: '💡', title: 'Ideas', items: [] }
  ],
  notes: ''
});
let S;
try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch { S = defaults(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const ui = { tab: 'hoy', fin: 'mov', month: mKey(new Date()) };

/* ---------- icons ---------- */
const I = {
  hoy: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  fin: '<circle cx="12" cy="12" r="9"/><path d="M14.5 9a2.5 2.5 0 0 0-2.5-1.5c-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2A2.7 2.7 0 0 1 9.5 14.5M12 6v1.5M12 16.5V18"/>',
  metas: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  hab: '<path d="M4 12l5 5L20 6"/>',
  int: '<path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"/>',
  notas: '<path d="M5 3h10l4 4v14H5z"/><path d="M14 3v5h5M8 13h8M8 17h6"/>',
  radar: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9"/><path d="M12 12l5-5"/><circle cx="12" cy="12" r="1"/>',
  mas: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  precios: '<path d="M3 12l9-9h9v9l-9 9z"/><circle cx="16.5" cy="7.5" r="1"/>',
  gastos: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const NAV_ORDER = ['hoy', 'gastos', 'precios', 'hab', 'fin', 'radar', 'metas', 'int', 'notas'], NAV_MAIN = ['hoy', 'gastos', 'precios', 'hab'];
const tabName = k => TABS.find(t => t[0] === k)[1];
const TABS = [['hoy', 'Hoy'], ['radar', 'Radar'], ['precios', 'Precios'], ['gastos', 'Gastos'], ['fin', 'Finanzas'], ['metas', 'Metas'], ['hab', 'Hábitos'], ['int', 'Intereses'], ['notas', 'Notas']];

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
function form(title, fields, onSubmit, opts = {}) {
  const body = fields.map(f => {
    const v = f.value ?? '';
    let input;
    if (f.type === 'select') input = `<select name="${f.name}">${f.options.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea name="${f.name}" style="min-height:90px">${esc(v)}</textarea>`;
    else input = `<input name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${f.step ? `step="${f.step}"` : ''} ${f.inputmode ? `inputmode="${f.inputmode}"` : ''} ${f.required ? 'required' : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} autocomplete="off">`;
    return `<label class="f">${esc(f.label)}</label>${input}`;
  }).join('');
  dlg.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${opts.text ? `<p class="muted" style="margin:4px 0 0">${opts.text}</p>` : ''}${body}<div class="dlg-actions"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary">${esc(opts.ok || 'Guardar')}</button></div></form>`;
  const fm = $('form', dlg);
  $('[data-x]', dlg).onclick = () => dlg.close();
  fm.onsubmit = e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(fm).entries());
    dlg.close();
    onSubmit(data);
  };
  dlg.showModal();
  const first = $('input,select,textarea', dlg); if (first) setTimeout(() => first.focus(), 30);
}
function confirmBox(title, text, onYes, ok = 'Confirmar') {
  dlg.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3><p class="muted">${text}</p><div class="dlg-actions"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary">${esc(ok)}</button></div></form>`;
  $('[data-x]', dlg).onclick = () => dlg.close();
  $('form', dlg).onsubmit = e => { e.preventDefault(); dlg.close(); onYes(); };
  dlg.showModal();
}
function toast(msg) {

/* ---------- derived ---------- */
const txOfMonth = k => S.tx.filter(t => t.date.startsWith(k));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + f(x), 0);
function monthStats(k) {
  const t = txOfMonth(k);
  const inc = sum(t.filter(x => x.type === 'in'), x => x.amount);
  const out = sum(t.filter(x => x.type === 'out'), x => x.amount);
  return { inc, out, bal: inc - out, rate: inc > 0 ? ((inc - out) / inc) * 100 : 0 };
}
const netWorth = () => sum(S.accounts, a => a.kind === 'Deuda' ? -a.value : a.value);
const byCat = k => {
  const m = {};
  txOfMonth(k).filter(t => t.type === 'out').forEach(t => { m[t.cat] = (m[t.cat] || 0) + t.amount; });
  return Object.entries(m).sort((a, b) => b[1] - a[1]);
};
function weekCount(h) {
  const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  let n = 0;
  for (let i = 0; i < 7; i++) { if (h.log[dKey(d)]) n++; d.setDate(d.getDate() + 1); }
  return n;
}
function streak(h) {
  let n = 0; const d = new Date();
  if (!h.log[dKey(d)]) d.setDate(d.getDate() - 1);
  while (h.log[dKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- charts ---------- */
function donut(data) {
  const total = sum(data, d => d[1]);
  if (!total) return '';
  let off = 25;
  const arcs = data.map(([c, v], i) => {
    const p = (v / total) * 100;
    const s = `<circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--c${(i % 8) + 1})" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`;
    off -= p; return s;
  }).join('');
  return `<svg viewBox="0 0 42 42" width="150" height="150" role="img" aria-label="Gasto por categoría">${arcs}<text x="21" y="21.8" text-anchor="middle" style="fill:var(--text);font-size:6px;font-weight:700">${esc(eur0.format(total))}</text></svg>`;
}
function bars(series, labels, w = 520, h = 140) {
  const max = Math.max(1, ...series.flatMap(s => s.v));
  const n = labels.length, gw = (w - 30) / n;
  let g = '';
  labels.forEach((l, i) => {
    series.forEach((s, j) => {
      const bw = Math.min(18, gw / (series.length + 1));
      const bh = (s.v[i] / max) * (h - 30);
      const x = 30 + i * gw + gw / 2 - (series.length * bw) / 2 + j * bw;
      g += `<rect x="${x}" y="${h - 20 - bh}" width="${bw - 2}" height="${Math.max(bh, 0)}" rx="3" fill="${s.c}"/>`;
    });
    g += `<text x="${30 + i * gw + gw / 2}" y="${h - 6}" text-anchor="middle">${esc(l)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${g}<line x1="30" x2="${w}" y1="${h - 20}" y2="${h - 20}" stroke="var(--line)"/></svg>`;
}
function line(points, w = 520, h = 160) {
  const max = Math.max(1, ...points.flatMap(p => [p.a, p.b])), n = points.length - 1 || 1;
  const X = i => 40 + (i / n) * (w - 50), Y = v => h - 24 - (v / max) * (h - 40);
  const path = k => points.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p[k]).toFixed(1)}`).join(' ');
  const ticks = [0, .5, 1].map(f => `<text x="36" y="${Y(max * f) + 3}" text-anchor="end">${esc(compact(max * f))}</text><line x1="40" x2="${w - 10}" y1="${Y(max * f)}" y2="${Y(max * f)}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join('');
  const xl = points.map((p, i) => i % Math.ceil(points.length / 6) === 0 ? `<text x="${X(i)}" y="${h - 8}" text-anchor="middle">${p.x}</text>` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${ticks}${xl}<path d="${path('b')}" fill="none" stroke="var(--c8)" stroke-width="2" stroke-dasharray="4 4"/><path d="${path('a')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg>`;
}
const compact = n => new Intl.NumberFormat('es-ES', { notation: 'compact', maximumFractionDigits: 1 }).format(n);

/* ---------- file saving (browser + Android) ---------- */
async function saveFile(name, mime, text) {
  const P = window.Capacitor?.Plugins;
  if (P?.Filesystem && P?.Share) {
    try {
      const r = await P.Filesystem.writeFile({ path: name, data: text, directory: 'CACHE', encoding: 'utf8' });
      await P.Share.share({ title: name, url: r.uri });
      return;
    } catch (err) { if (/cancel/i.test(String(err))) return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function priceCalc(p) {
  const priced = (p.history || []).filter(h => h.price > 0);
  if (!priced.length) return { last: null, date: '', min: null, diff: null, verdict: '' };
  const date = priced.map(h => h.date).sort().at(-1);
  const last = Math.min(...priced.filter(h => h.date === date).map(h => h.price));
  const min = Math.min(...priced.map(h => h.price));
  const diff = p.target > 0 ? last - p.target : null;
  const verdict = p.status === 'Vigilando' && p.target > 0 ? (last <= p.target ? 'COMPRAR' : 'Esperar') : '';
  return { last, date, min, diff, verdict };
}

/* ---------- importador BBVA (CSV) ---------- */
function parseBBVA(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  const head = (lines.shift() || '').split(';').map(s => s.trim().toLowerCase());
  const ix = n => head.indexOf(n);
  const [iF, iC, iI, iS, iA, iE, iK] = ['fecha', 'concepto', 'importe', 'saldo', 'cuenta', 'estado', 'categoría'].map(ix);
  if ([iF, iC, iI].some(i => i < 0)) throw new Error('No parece un CSV de BBVA (faltan Fecha/Concepto/Importe).');
  const parseNum = s => { s = String(s ?? '').trim(); if (!s) return null; const n = parseFloat(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s); return Number.isFinite(n) ? n : null; };
  const out = { tx: [], balances: {}, internal: 0, pending: 0 };
  for (const l of lines) {
    const c = l.split(';'), date = (c[iF] || '').trim(), concept = (c[iC] || '').trim(), amt = parseNum(c[iI]);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || amt == null) continue;
    const acc = (c[iA] || '').trim(), saldo = parseNum(c[iS]);
    if (acc && saldo != null) out.balances[acc] = saldo;
    if (/^pendiente/i.test((c[iE] || '').trim())) { out.pending++; continue; }
    if (/^traspaso\b/i.test(concept)) { out.internal++; continue; }
    const bcat = (c[iK] || '').trim();
    const type = amt >= 0 ? 'in' : 'out';
    const cat = type === 'in' ? (bcat === 'Nómina' ? 'Nómina' : 'Otros') : (CATS_OUT.includes(bcat) ? bcat : 'Otros');
    const note = concept.replace(/\s*-\s*(Pago con tarjeta|\[OCULTO\])\s*$/i, '').replace(/\s*\.\.\.\s*$/, '').trim();
    out.tx.push({ date, type, amount: Math.abs(amt), cat, note: note || concept, src: 'bbva', key: [date, concept, amt, acc, saldo ?? ''].join('|') });
  }
  return out;
}
function applyBBVA(text) {
  const r = parseBBVA(text);
  const have = new Set(S.tx.filter(t => t.key).map(t => t.key));
  let added = 0;
  r.tx.forEach(t => { if (!have.has(t.key)) { S.tx.push({ id: uid(), ...t }); added++; } });
  Object.entries(r.balances).forEach(([acc, v]) => {
    const name = 'BBVA · ' + acc;
    const a = S.accounts.find(x => x.name === name);
    if (a) a.value = v; else S.accounts.push({ id: uid(), name, kind: 'Efectivo / cuenta', value: v });
  });
  return { added, dupes: r.tx.length - added, internal: r.internal, pending: r.pending, accounts: Object.keys(r.balances).length };
}
function importBBVA() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.csv,text/csv,text/plain';
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    try { const r = applyBBVA(await inp.files[0].text()); commit(); toast(`BBVA: ${r.added} nuevos, ${r.dupes} ya estaban`); }
    catch (e) { toast(e.message || 'No se pudo leer el CSV'); }
  };
  inp.click();
}

  const cards = C.rows.map((r, i) => {
    const g = r.g, locked = C.locked && r.kind === 'prio';
    const badge = locked ? '<span class="badge alta">Bloqueada</span>' : r.covered ? '<span class="badge buy">Cubierta</span>' : r.late ? '<span class="badge alta">Fuera de plazo</span>' : '<span class="badge">En curso</span>';
    const etaTxt = r.covered ? '' : r.eta === undefined ? 'Sin ahorro mensual: no hay fecha estimada.' : r.eta ? `Estimada: ${longMonth(r.eta)}` : '';
    let foot;
    if (r.kind === 'saldo') foot = r.covered ? '<span class="good">Objetivo alcanzado.</span>' : `<div class="row between" style="flex-wrap:wrap;gap:6px 14px"><span>Faltan <b class="num">${eur(r.falta)}</b></span><span>Necesitas <b class="num">${eur(r.perMonth)}</b>/mes${r.dl ? ' hasta el ' + r.dl.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : ''}</span></div><div class="muted" style="margin-top:6px;font-size:14px">${etaTxt ? etaTxt + (C.rit > 0 ? ` al ritmo actual (${eur(C.rit)}/mes)` : '') : ''}${r.late ? ' <b class="bad">No llegas a tiempo con ese ritmo.</b>' : ''}</div><div class="muted" style="margin-top:4px;font-size:13px">Si compras las metas anteriores, este saldo baja.</div>`;
    else foot = locked ? '<span class="muted">Reparto bloqueado por el colchón.</span>' : r.covered ? '<span class="good">Cubierta con lo que tienes disponible.</span>' : `<div class="row between" style="flex-wrap:wrap;gap:6px 14px"><span>Faltan <b class="num">${eur(r.falta)}</b></span><span class="muted">${etaTxt}${g.due ? ` · fecha límite ${longMonth(r.due)}` : ''}</span></div>${r.late ? `<div class="bad" style="margin-top:6px;font-weight:600">Llegarías ${r.monthsLate} mes${r.monthsLate > 1 ? 'es' : ''} tarde con el ritmo actual.</div>` : ''}`;
    const items = g.items ? `<details style="margin-top:12px"><summary class="muted" style="cursor:pointer">Desglose del presupuesto</summary><div class="list" style="margin-top:6px">${g.items.map(x => `<div class="item"><span class="grow">${esc(x.n)}</span><span class="num">${money(x.v, 0)}</span></div>`).join('')}</div></details>` : '';
    const prio = M.list.filter(x => x.kind !== 'saldo');
    return `<div class="card meta"><div class="row" style="align-items:flex-start;gap:12px"><div class="grow"><h3 style="font-size:18px">${esc(g.name)}</h3>${g.sub ? `<div class="muted" style="font-size:13px;margin-top:2px">${esc(g.sub)}</div>` : ''}</div>${badge}</div>
      <div class="row between" style="align-items:flex-end;margin:16px 0 10px"><div class="pctbig num ${locked ? 'muted' : ''}" data-count="${Math.round(r.pct)}">${Math.round(r.pct)}%</div><div class="num" style="text-align:right"><b style="font-size:20px">${eur(r.shown)}</b><span class="muted"> / ${eur(r.t)}</span></div></div>
      <div class="bar lg ${locked ? 'off' : ''}" role="progressbar" aria-valuenow="${Math.round(r.pct)}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(g.name)}"><i data-w="${r.pct.toFixed(1)}%" style="width:0"></i></div>
      <div style="margin-top:12px;font-size:15px">${foot}</div>${items}
      <div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn sm" data-act="metaEdit" data-id="${g.id}">Editar</button>${g.kind !== 'saldo' && prio.indexOf(g) > 0 ? `<button class="btn sm" data-act="metaUp" data-id="${g.id}" aria-label="Subir prioridad">Subir</button>` : ''}${g.kind !== 'saldo' && prio.indexOf(g) < prio.length - 1 ? `<button class="btn sm" data-act="metaDown" data-id="${g.id}" aria-label="Bajar prioridad">Bajar</button>` : ''}<button class="btn sm danger" data-act="metaDel" data-id="${g.id}">Quitar</button></div></div>`;
  }).join('');
  return `${head}<div class="grid g2 section">${cards}</div>`;
}
function metasTop(n) {
  const C = metasCalc(); if (C.saldo == null) return '<div class="empty">Carga tu Excel para ver cuánto llevas de cada meta.</div>';
  return `<div class="list">${C.rows.slice(0, n).map(r => `<div class="item" style="display:block"><div class="row between"><span>${esc(r.g.name)}</span><span class="num muted">${Math.round(r.pct)}%</span></div><div class="sp" style="height:6px"></div><div class="bar"><i data-w="${r.pct.toFixed(1)}%" style="width:0"></i></div></div>`).join('')}</div>`;
}
function metaAdd() {
  form('Nueva meta', [{ name: 'name', label: 'Nombre', required: true }, { name: 'target', label: 'Objetivo (€)', inputmode: 'decimal', required: true }, { name: 'due', label: 'Fecha límite (opcional)', type: 'month' }],
    d => { const t = Math.abs(num(d.target)); if (!t) return; ensureMetas().list.splice(ensureMetas().list.filter(x => x.kind !== 'saldo').length, 0, { id: uid(), kind: 'prio', name: d.name.trim(), sub: '', target: t, due: d.due || '' }); commit(); },
    { ok: 'Añadir', text: 'Entra al final de la lista de prioridades.' });
}
function metaEdit(id) {
  const g = ensureMetas().list.find(x => x.id === id); if (!g) return;
  const f = [{ name: 'name', label: 'Nombre', value: g.name, required: true }];
  if (g.items) g.items.forEach((x, i) => f.push({ name: 'i' + i, label: x.n + ' (€)', value: String(x.v).replace('.', ','), inputmode: 'decimal' }));
  else f.push({ name: 'target', label: 'Objetivo (€)', value: String(g.target).replace('.', ','), inputmode: 'decimal', required: true });
  if (g.kind === 'saldo') f.push({ name: 'deadline', label: 'Fecha límite', type: 'date', value: g.deadline || '' });
  else f.push({ name: 'due', label: 'Fecha límite (opcional)', type: 'month', value: g.due || '' });
  form('Editar meta', f, d => {
    g.name = d.name.trim() || g.name;
    if (g.items) g.items.forEach((x, i) => { x.v = Math.abs(num(d['i' + i])); }); else g.target = Math.abs(num(d.target)) || g.target;
    if (g.kind === 'saldo') g.deadline = d.deadline || ''; else g.due = d.due || '';
    commit();
  }, { text: g.items ? 'El objetivo es la suma del desglose.' : '' });
}
function metaCfg() {
  const M = ensureMetas(), v = x => x == null ? '' : String(x).replace('.', ',');
  form('Ajustes de metas', [
    { name: 'baseline', label: 'Colchón intocable (€)', value: v(M.baseline), inputmode: 'decimal', required: true },
    { name: 'saldo', label: 'Saldo a mano (€, solo si no hay Excel)', value: v(M.saldoManual), inputmode: 'decimal' },
    { name: 'ritmo', label: 'Ahorro mensual a mano (€, vacío = automático)', value: v(M.ritmoManual), inputmode: 'decimal' }
  ], d => { M.baseline = Math.abs(num(d.baseline)); M.saldoManual = d.saldo.trim() ? num(d.saldo) : null; M.ritmoManual = d.ritmo.trim() ? num(d.ritmo) : null; commit(); }, { text: 'Con el Excel cargado, el saldo y el ahorro medio salen de ahí.' });
}
function metaMove(id, dir) {
  const L = ensureMetas().list, p = L.filter(x => x.kind !== 'saldo'), g = L.find(x => x.id === id), i = p.indexOf(g), o = p[i + dir]; if (!o) return;
  const a = L.indexOf(g), b = L.indexOf(o); [L[a], L[b]] = [L[b], L[a]]; commit();
}
function animateMetas() {
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('[data-w]').forEach(e => { e.style.width = e.dataset.w; })));
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count; if (reduce || !to) return; const t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + '%'; if (k < 1) requestAnimationFrame(step); };
    el.textContent = '0%'; requestAnimationFrame(step);
  });
}

/* ---------- render ---------- */

const VIEWS = { hoy: viewHoy, radar: viewRadar, precios: viewPrecios, gastos: viewGastos, fin: viewFin, metas: viewMetas, hab: viewHab, int: viewInt, notas: viewNotas };
const FABS = {
  fin: () => ui.fin === 'mov' ? ['+ Movimiento', addTx] : ui.fin === 'pat' ? ['+ Cuenta', addAcc] : null,
  radar: () => ['+ Radar', addRadar], precios: () => ['+ Producto', addPrice], metas: () => ['+ Meta', metaAdd], hab: () => ['+ Hábito', addHab], int: () => ['+ Lista', addList]
};
function render() {
  document.documentElement.dataset.theme = S.theme === 'auto' ? '' : S.theme;
  $('#nav').innerHTML = `<div class="brand">Cockpit</div>` + NAV_ORDER.map(k => `<button data-tab="${k}" class="${NAV_MAIN.includes(k) ? '' : 'x2'}${k === 'fin' ? ' gap' : ''}" aria-current="${ui.tab === k}">${icon(k)}<span>${tabName(k)}</span></button>`).join('') + `<button class="more" data-act="more" aria-current="${!NAV_MAIN.includes(ui.tab)}">${icon('mas')}<span>Más</span></button>`;
  $('#hello').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#title').textContent = ui.tab === 'hoy' ? `${greet()}${S.name ? ', ' + S.name : ''}` : TABS.find(t => t[0] === ui.tab)[1];
  const y = scrollY;
  $('#view').innerHTML = VIEWS[ui.tab]();
  const fab = $('#fab'), f = FABS[ui.tab]?.();
  fab.hidden = !f; if (f) { fab.textContent = f[0]; fab.onclick = f[1]; }
  scrollTo(0, y);
  animateMetas();
}
const commit = () => { save(); render(); };

/* ---------- actions ---------- */
function addTx() {
  const today = dKey(new Date());
  form('Nuevo movimiento', [
    { name: 'type', label: 'Tipo', type: 'select', options: ['Gasto', 'Ingreso'] },
    { name: 'amount', label: 'Importe (€)', inputmode: 'decimal', required: true, placeholder: '0,00' },
    { name: 'cat', label: 'Categoría', type: 'select', options: [...CATS_OUT, '— ingresos —', ...CATS_IN] },
    { name: 'note', label: 'Concepto (opcional)' },
    { name: 'date', label: 'Fecha', type: 'date', value: ui.month === mKey(new Date()) ? today : ui.month + '-01' }
  ], d => {
    const amount = Math.abs(num(d.amount)); if (!amount) return;
    const type = d.type === 'Ingreso' ? 'in' : 'out';
    let cat = d.cat; if (cat.startsWith('—')) cat = 'Otros';
    S.tx.push({ id: uid(), date: d.date || today, type, amount, cat, note: d.note.trim() });
    ui.month = (d.date || today).slice(0, 7); commit();
  }, { text: 'Si es un ingreso, elige una categoría de la parte de «ingresos».' });
}
function addAcc() {
  form('Nueva cuenta', [
    { name: 'name', label: 'Nombre', required: true, placeholder: 'Ej. Cuenta nómina, Fondo indexado…' },
    { name: 'kind', label: 'Tipo', type: 'select', options: ['Efectivo / cuenta', 'Inversión', 'Cripto', 'Inmueble', 'Otro activo', 'Deuda'] },
    { name: 'value', label: 'Valor actual (€)', inputmode: 'decimal', required: true }
  ], d => { S.accounts.push({ id: uid(), name: d.name.trim(), kind: d.kind, value: Math.abs(num(d.value)) }); commit(); });
}
function addHab() {
  form('Nuevo hábito', [
    { name: 'name', label: 'Nombre', required: true },
    { name: 'goal', label: 'Veces por semana (vacío = sin objetivo)', type: 'number', inputmode: 'numeric', placeholder: 'Ej. 4' }
  ], d => { S.habits.push({ id: uid(), name: d.name.trim(), goal: Math.min(7, Math.max(0, parseInt(d.goal, 10) || 0)), log: {} }); commit(); });
}
function addList() {
  form('Nueva lista', [{ name: 'emoji', label: 'Emoji', value: '⭐' }, { name: 'title', label: 'Título', required: true }],
    d => { S.lists.push({ id: uid(), emoji: d.emoji.trim() || '⭐', title: d.title.trim(), items: [] }); commit(); });
}
function settings() {
  form('Ajustes', [
    { name: 'name', label: 'Tu nombre', value: S.name },
    { name: 'theme', label: 'Tema', type: 'select', options: ['auto', 'oscuro', 'claro'], value: { auto: 'auto', dark: 'oscuro', light: 'claro' }[S.theme] }
  ], d => { S.name = d.name.trim(); S.theme = { auto: 'auto', oscuro: 'dark', claro: 'light' }[d.theme]; commit(); }, {
    text: 'Tus datos viven solo en este dispositivo. Usa <b>Exportar</b> para llevarlos de un dispositivo a otro.'
  });
  const bar = document.createElement('div'); bar.className = 'dlg-actions'; bar.style.justifyContent = 'flex-start'; bar.style.flexWrap = 'wrap';
  bar.innerHTML = '<button type="button" class="btn sm" data-x1>Exportar copia</button><button type="button" class="btn sm" data-x2>Importar copia</button><button type="button" class="btn sm danger" data-x3>Borrar todo</button>';
  $('form', dlg).appendChild(bar);
  $('[data-x1]', dlg).onclick = () => saveFile(`cockpit-${dKey(new Date())}.json`, 'application/json', JSON.stringify(S, null, 2));
  $('[data-x2]', dlg).onclick = () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = async () => {
      try { const j = JSON.parse(await inp.files[0].text()); if (!Array.isArray(j.tx)) throw 0; S = Object.assign(defaults(), j); dlg.close(); commit(); toast('Copia importada'); }
      catch { toast('Archivo no válido'); }
    };
    inp.click();
  };
  $('[data-x3]', dlg).onclick = () => { dlg.close(); confirmBox('¿Borrar todo?', 'Se eliminarán todos tus datos de este dispositivo. No se puede deshacer.', () => { S = defaults(); commit(); }, 'Borrar todo'); };
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-go],[data-fin],[data-month],[data-act],[data-rf],[data-pf],[data-gx],[data-gxm]'); if (!t) return;
  const D = t.dataset;
  if (D.tab) { if (dlg.open) dlg.close(); ui.tab = D.tab; return render(); }
  if (D.rf) { ui.radarF = D.rf; return render(); }
  if (D.pf) { ui.pf = D.pf; return render(); }
  if (D.gx) { ui.gx = D.gx; return render(); }
  if (D.gxm) { ui.gxm = D.gxm === 'avg' ? 'avg' : +D.gxm; return render(); }
  if (D.go) { ui.tab = D.go; if (D.fin) ui.fin = D.fin; return render(); }
  if (D.fin) { ui.fin = D.fin; return render(); }
  if (D.month) { ui.month = shiftMonth(ui.month, +D.month); return render(); }
  const l = S.lists.find(x => x.id === D.l), item = l?.items.find(x => x.id === D.i);
  switch (D.act) {
    case 'delTx': S.tx = S.tx.filter(x => x.id !== D.id); return commit();
    case 'delAcc': return confirmBox('¿Borrar cuenta?', 'Se quitará del patrimonio.', () => { S.accounts = S.accounts.filter(x => x.id !== D.id); commit(); }, 'Borrar');
    case 'editAcc': { const a = S.accounts.find(x => x.id === D.id); return form(a.name, [{ name: 'value', label: 'Valor actual (€)', inputmode: 'decimal', value: a.value }], d => { a.value = Math.abs(num(d.value)); commit(); }); }
    case 'togHab': { const h = S.habits.find(x => x.id === D.id); h.log[D.d] ? delete h.log[D.d] : (h.log[D.d] = true); return commit(); }
    case 'delHab': return confirmBox('¿Borrar hábito?', 'Se pierde también su historial.', () => { S.habits = S.habits.filter(x => x.id !== D.id); commit(); }, 'Borrar');
    case 'stepR': { const r = S.radar.find(x => x.id === D.id); r.status = R_NEXT[r.status] || 'Pendiente'; return commit(); }
    case 'delR': S.radar = S.radar.filter(x => x.id !== D.id); return commit();
    case 'csv': return exportCSV();
    case 'bbva': return importBBVA();
    case 'more': dlg.innerHTML = `<h3>Más</h3><div class="sheet">${NAV_ORDER.filter(k => !NAV_MAIN.includes(k)).map(k => `<button data-tab="${k}" aria-current="${ui.tab === k}">${icon(k)}${tabName(k)}</button>`).join('')}</div>`; dlg.showModal(); return;
    case 'metaEdit': return metaEdit(D.id);
    case 'metaCfg': return metaCfg();
    case 'metaUp': return metaMove(D.id, -1);
    case 'metaDown': return metaMove(D.id, 1);
    case 'metaDel': return confirmBox('¿Quitar esta meta?', 'Se elimina de la lista y el reparto se recalcula.', () => { S.metas.list = S.metas.list.filter(x => x.id !== D.id); commit(); }, 'Quitar');
    case 'gxLoad': dlg.innerHTML = `<h3>Cargar el Excel</h3><div class="sheet"><button data-act="gxFile">${icon('hoy').replace(/<path[^>]*\/>/g,'')}Elegir un archivo .xlsx</button><button data-act="gxDrive">Leer de Google Drive</button></div><p class="muted" style="font-size:13px;margin:10px 4px 0">El archivo es «Seguimiento de gastos BBVA». Con el .xlsx funciona en el móvil y en el ordenador.</p>`; dlg.showModal(); return;
    case 'gxFile': dlg.open && dlg.close(); return gxPickFile();
    case 'gxDrive': dlg.open && dlg.close(); return gxDrive();
    case 'gxBBVA': return gxBBVA();
    case 'gxEdit': return gxEdit(D.id);
    case 'gxExport': e.preventDefault(); return gxExport();
    case 'gxMore': ui.gxLimit = (ui.gxLimit || 60) + 60; return render();
    case 'gxTope': return form('Tope mensual', [{ name: 'v', label: D.g + ' (€/mes, vacío para quitar)', inputmode: 'decimal' }], d => { const v = Math.abs(num(d.v)); v ? S.gx.topes[D.g] = v : delete S.gx.topes[D.g]; commit(); }, { text: 'Se guarda en este dispositivo; no cambia el Excel.' });
    case 'addCheck': return addCheck(S.prices.find(x => x.id === D.id));
    case 'delPrice': return confirmBox('¿Quitar producto?', 'Se borra junto con todo su historial.', () => { S.prices = S.prices.filter(x => x.id !== D.id); commit(); }, 'Quitar');
    case 'tick': item.done = !item.done; return commit();
    case 'delItem': l.items = l.items.filter(x => x.id !== D.i); return commit();
    case 'addItem': return form(`Añadir a ${l.title}`, [{ name: 'text', label: 'Texto', required: true }], d => { l.items.push({ id: uid(), text: d.text.trim(), done: false }); commit(); }, { ok: 'Añadir' });
    case 'delList': return confirmBox('¿Borrar lista?', `Se eliminará «${esc(l.title)}» y su contenido.`, () => { S.lists = S.lists.filter(x => x.id !== D.l); commit(); }, 'Borrar');
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.bud !== undefined) { const v = num(t.value); v > 0 ? S.budgets[t.dataset.bud] = v : delete S.budgets[t.dataset.bud]; commit(); }
  if (t.dataset.sim) { ui.sim[t.dataset.sim] = Math.max(0, num(t.value)); ui.sim.años = Math.min(60, Math.round(ui.sim.años) || 1); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'notes') { S.notes = e.target.value; save(); }
  if (e.target.id === 'gxq') { ui.gxf.q = e.target.value; const p = e.target.selectionStart; render(); const n = $('#gxq'); if (n) { n.focus(); n.setSelectionRange(p, p); } }
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset.gxf && t.id !== 'gxq') { ui.gxf[t.dataset.gxf] = t.value; ui.gxLimit = 0; render(); } });
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
$('#settingsBtn').onclick = settings;

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__cockpit = { get S() { return S; }, ui, render, gxView, gxIngest };
})();
</script>
</body>
